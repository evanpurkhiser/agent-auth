name: Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (example: 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tests are passing on main
        run: |
          SHA=$(git rev-parse origin/main)
          echo "Waiting for tests on ${SHA}..."
          gh run list --workflow=ci.yml --branch=main --commit "$SHA" --limit=1 --json databaseId --jq '.[0].databaseId' | xargs gh run watch --exit-status --compact

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver like 0.2.0"
            exit 1
          fi

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0

      - name: Bump package version
        env:
          VERSION: ${{ inputs.version }}
        run: uv version --frozen "$VERSION"

      - name: Commit and push release
        uses: evanpurkhiser/workflows/actions/commit-and-push@main
        with:
          stage-script: git add pyproject.toml
          branch: main
          commit-message: release v${{ inputs.version }}
          tag: v${{ inputs.version }}

      - name: Dispatch publish workflow for tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          gh workflow run release.yml --ref "${TAG}"
