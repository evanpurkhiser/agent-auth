[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-auth"
version = "0.1.3"
description = "Context-aware routing and authorization for SSH agent requests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Evan Purkhiser", email = "agent-auth.py@evanpurkhiser.com" },
]
keywords = ["ssh-agent", "systemd", "tailscale"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/evanpurkhiser/agent-auth"
Repository = "https://github.com/evanpurkhiser/agent-auth"

[project.scripts]
ssh-agent-ctx = "agent_proxy.context:run"
ssh-agent-proxy = "agent_proxy.service:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["agent_proxy"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
